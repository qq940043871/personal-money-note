    <style>
        html, body {

    <script>
        function loadPage(page) {
            document.getElementById('mainFrame').src = page;

            // 更新导航激活状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active-nav');
            });
            event.currentTarget.classList.add('active-nav');
        }
    </script>
