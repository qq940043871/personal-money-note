<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易方法</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        .tab-bar { display: flex; gap: 0; background: #fff; border-bottom: 1px solid #E2E8F0; padding: 0 16px; height: 42px; align-items: center; flex-shrink: 0; overflow-x: auto; }
        .tab-bar::-webkit-scrollbar { height: 0; }
        .tab-btn { padding: 8px 16px; cursor: pointer; font-size: 13px; color: #64748B; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; white-space: nowrap; }
        .tab-btn:hover { color: #334155; }
        .tab-btn.active { border-bottom-color: #6366F1; color: #4F46E5; font-weight: 600; }
        .tab-frame { width: 100%; height: calc(100vh - 42px); border: 0; background: #F8FAFC; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="tab-btn active" onclick="switchTab(this,'strategies.html')">策略总览</div>
        <div class="tab-btn" onclick="switchTab(this,'volume_price.html')">量价关系</div>
        <div class="tab-btn" onclick="switchTab(this,'stock_cycle.html')">股价周期</div>
        <div class="tab-btn" onclick="switchTab(this,'market_resonance.html')">大盘共振</div>
    </div>
    <iframe id="tabFrame" class="tab-frame" src="strategies.html"></iframe>
    <script>
        function switchTab(btn, page) {
            document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById('tabFrame').src = page;
        }
        function loadPage(page, title, evt) { parent.loadPage(page, title, evt); }
    </script>
</body>
</html>
